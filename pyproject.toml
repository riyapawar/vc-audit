[project]
name = "vc-audit"
version = "0.1.0"
description = "Auditable fair-value estimation for private venture portfolio companies."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]
# Optional: model-driven peer selection. The tool runs fully without it.
research = ["anthropic>=0.69"]

[project.scripts]
vc-audit = "vc_audit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vc_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares query parameters by calling Query() in the default; that is
# the framework's documented pattern, not the mutable-default bug B008 targets.
"src/vc_audit/api/main.py" = ["B008"]
